<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熊的窝</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav>
    <a href="/" class="logo">🐻 熊的窝</a>
    <div class="nav-links">
      <a href="/">首页</a>
      <a href="/admin.html">管理</a>
    </div>
  </nav>

  <main id="app">
    <div id="loading">加载中...</div>
  </main>

  <footer>
    <p>© <span id="year"></span> 熊的窝 · Powered by Cloudflare Workers + D1</p>
  </footer>

  <script>
  const API = 'https://my-blog-api.ostwaltamy.workers.dev';
  const app = document.getElementById('app');

  async function loadPosts() {
    app.innerHTML = '<div id="loading">加载中...</div>';
    try {
      const res = await fetch(API + '/api/settings');
      const sdata = await res.json();
      const settings = sdata.settings || {};
      document.title = settings.blog_title || '熊的窝';
      if (settings.theme_primary_color) {
        document.documentElement.style.setProperty('--accent', settings.theme_primary_color);
        document.documentElement.style.setProperty('--bg', settings.theme_bg_color || '#fafafa');
      }
    } catch(e) {}

    try {
      const res = await fetch(API + '/api/posts');
      const data = await res.json();
      const posts = data.posts || [];

      // 记录访问
      fetch(API + '/api/pageview', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({path: window.location.pathname}) }).catch(()=>{});

      let html = '<h1>📝 最近的文章</h1><div class="posts-list">';
      if (posts.length === 0) {
        html += '<p style="color: var(--muted);">还没有文章，快去后台发布吧！</p>';
      }
      posts.forEach(p => {
        html += '<article class="post-card"><a href="/post.html?slug=' + p.slug + '"><h2>' + escapeHtml(p.title) + '</h2></a>';
        html += '<div class="meta">' + (p.created_at || '').slice(0,10) + '</div>';
        if (p.excerpt) html += '<p>' + escapeHtml(p.excerpt) + '</p>';
        html += '<a href="/post.html?slug=' + p.slug + '" class="read-more">阅读更多 →</a></article>';
      });
      html += '</div>';
      app.innerHTML = html;
    } catch(e) {
      app.innerHTML = '<p style="color: var(--accent);">加载失败: ' + e.message + '</p>';
    }
  }

  function escapeHtml(t) {
    const d = document.createElement('div');
    d.textContent = t;
    return d.innerHTML;
  }

  document.getElementById('year').textContent = new Date().getFullYear();
  loadPosts();
  </script>
</body>
</html>
